<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App - Coloro</title>
    <link rel="stylesheet" href="css/css-reset.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="./scripts/app.js" type="module"></script>
</head>
<body>
    <header>
        <nav>
            <h1>Coloro - App</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="app.html" aria-current="true">App</a></li>
            </ul>
        </nav>
    </header>

    <div class="wrapper">
        <h2>Choose A Color</h2>

        <div class="controls-deck">
            <div class="picker-group">
                <input id="color-picker" type="color" value="#2cd1dd">
            </div>

            <div class="input-container smart-field">
                <label for="smart-color-input">Color Input (Accepts Hex, RGB, and HSL)</label>
                <input type="text" id="smart-color-input" placeholder="Paste Hex, RGB, or HSL...">
            </div>

            <div class="input-container count-field">
                <label for="number-of-colors">Palette Size</label>
                <input type="number" id="number-of-colors" value="5" min="3" max="9">
            </div>
        </div>

        <div id="message-box"></div>
    </div>

    <div class="wrapper">

        <h2>Palettes</h2>

        <div class="color-card">
            <h2>Analogous Colors <span>(Adjacent Colors)</span></h2>
            <div class="color-container" id="adjacent-container"></div>
        </div>

        <div class="color-card">
            <h2>Split Complementary Colors</h2>
            <div class="color-container" id="split-complementary-container"></div>
        </div>

        <div class="color-card">
            <h2>Triadic Colors <span>(Three Colors)</span></h2>
            <div class="color-container" id="triadic-container"></div>
        </div>

        <div class="color-card">
            <h2>Tetradic Colors <span>(Four Colors)</span></h2>
            <div class="color-container" id="tetradic-container"></div>
        </div>

        <div class="color-card">
            <h2>Monochromatic Colors</h2>
            <div class="color-container" id="monochromatic-container"></div>
        </div>

    </div>
</body>
</html>
